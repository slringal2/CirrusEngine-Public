name: Build and shader checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configure
        run: cmake --preset windows
      - name: Build
        run: cmake --build --preset release --parallel
      - name: Weather invariants and WARP shader compilation
        run: ctest --preset release
      - name: Native Visual Studio solution (Release and Debug)
        shell: pwsh
        run: |
          $cirrusMSBuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\Current\Bin\MSBuild.exe
          foreach ($cirrusConfig in @('Release','Debug')) {
            & $cirrusMSBuild CirrusEngine.sln /m "/p:Configuration=$cirrusConfig" /p:Platform=x64 /nologo /v:minimal
            if ($LASTEXITCODE -ne 0) { throw "Native $cirrusConfig build failed" }
          }
      - name: Shader failure diagnostics
        if: failure()
        shell: pwsh
        run: Get-Content build/logs/cirrus.log -ErrorAction SilentlyContinue
      - name: Package
        run: cmake --install build --config Release --prefix out/CirrusEngine
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: CirrusEngine-Windows-x64
          path: out/CirrusEngine
          if-no-files-found: error
  portable-weather:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
